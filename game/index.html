<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMBRA PROTOCOL — a top-down stealth infiltration</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #05070c;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #game {
      display: block;
      width: min(100vw, calc(100vh * (1152 / 672)));
      aspect-ratio: 1152 / 672;
      height: auto;
      touch-action: none;
      outline: none;
    }
    /* Read aloud, never shown: the status line screen readers announce. */
    #status {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1152" height="672"
    aria-label="UMBRA PROTOCOL: sneak past guards' vision cones, steal the data core and reach the exit unseen"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
